name: Publish Package

# Every push to main publishes the next version to GitHub Packages,
# so consumers can always install the latest state of the library.
# A version is only published once the verify job is green.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          registry-url: "https://npm.pkg.github.com"

      - name: Configure npm for GitHub Packages
        run: |
          echo "@jordiorriols:registry=https://npm.pkg.github.com" >> .npmrc
          echo "//npm.pkg.github.com/:_authToken=\${NODE_AUTH_TOKEN}" >> .npmrc

      - name: Install dependencies
        run: npm ci

      # main only accepts reviewed pull requests, so the released version is
      # never committed back. The next version is the latest published one
      # plus a patch, unless package.json was raised above it through a pull
      # request (for a minor or major release), which is then used as is.
      - name: Pick the next version
        id: bump
        run: |
          published=$(npm view @jordiorriols/ui version 2>/dev/null || echo 0.0.0)
          ahead=$(PUBLISHED="$published" node -p "
            const parse = (v) => v.split('.').map(Number);
            const [a, b] = [parse(process.env.PUBLISHED), parse(require('./package.json').version)];
            const i = a.findIndex((n, k) => n !== b[k]);
            i !== -1 && b[i] > a[i];
          ")
          if [ "$ahead" != "true" ]; then
            npm version "$published" --no-git-tag-version --allow-same-version
            npm version patch --no-git-tag-version
          fi
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        run: npm run build

      - name: Publish
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag the release
        run: |
          git tag "v${{ steps.bump.outputs.version }}"
          git push origin "v${{ steps.bump.outputs.version }}"